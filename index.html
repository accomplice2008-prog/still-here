<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Still Here</title>
<div style="font-size:14px; opacity:0.6; margin-top:10px;">
  Когда тяжело, тревожно или пусто —  
  ты можешь просто быть здесь
</div>

<style>
body {
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background:#000;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

/* КРУГ */
.circle {
  width:280px;
  height:280px;
  border-radius:50%;
  background: radial-gradient(
  circle,
  rgba(255,255,255,0.12) 0%,
  rgba(255,255,255,0.06) 40%,
  rgba(255,255,255,0.02) 70%,
  transparent 100%
);

box-shadow: 0 0 80px rgba(255,255,255,0.08);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  transition: all 2s ease;
  animation: breathe 8s ease-in-out infinite;
}

/* СЖАТИЕ */
.circle.contract {
  transform: scale(0.8);
  opacity:0.6;
}

/* РАСШИРЕНИЕ */
.circle.expand {
  width:900px;
  height:900px;
  opacity:1;
}

/* ТЕКСТ */
.text {
  max-width:240px;
  line-height:1.6;
  opacity:1;
  transition:opacity 1s, transform 1s;
}

button {
  margin-top:20px;
  padding:10px 20px;
  border:none;
  border-radius:20px;
  background:#FFD700;
  color:#000;
  cursor:pointer;
  transition: all 0.3s ease;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 10px rgba(255,215,0,0.5);
}

/* ВАРИАНТЫ */
.options {
  margin-top:20px;
  opacity:0;
  transition:opacity 2s;
}

.options.show {
  opacity:1;
}

.lang {
  position:fixed;
  top:20px;
  right:20px;
  z-index:10;
}

.lang button {
  margin-left:5px;
  padding:5px 10px;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,0.1);
  color:#fff;
  cursor:pointer;
}

@keyframes breathe {
  0% { transform: scale(1); opacity:0.85; }
  50% { transform: scale(1.08); opacity:1; }
  100% { transform: scale(1); opacity:0.85; }
}
</style>

</head>

<body>

<div class="lang">
  <button onclick="setLang('ru')">RU</button>
  <button onclick="setLang('en')">EN</button>
  <button onclick="setLang('ua')">UA</button>
</div>

<div class="circle" id="circle">

  <div class="text" id="text"></div>

  <button id="startBtn" onclick="start()"></button>

  <div class="options" id="options">
    <p id="question"></p>

    <p onclick="choose('tired')" id="opt_tired"></p>
    <p onclick="choose('lost')" id="opt_lost"></p>
    <p onclick="choose('understood')" id="opt_understood"></p>
    <p onclick="choose('clear')" id="opt_clear"></p>
    <p onclick="choose('anxiety')" id="opt_anxiety"></p>
    <p onclick="choose('overload')" id="opt_overload"></p>
    <p onclick="choose('alone')" id="opt_alone"></p>
    <p onclick="choose('empty')" id="opt_empty"></p>
    <p onclick="choose('anger')" id="opt_anger"></p>
    <p onclick="choose('disappointed')" id="opt_disappointed"></p>
  </div>

</div>

<script>

let currentLang = localStorage.getItem("lang") || "ru";

function start(){

  const circle = document.getElementById("circle");
  const options = document.getElementById("options");

  circle.classList.add("contract");

  setTimeout(() => {

    circle.classList.remove("contract");
    circle.classList.add("expand");

    setTimeout(()=>{
      options.classList.add("show");
    }, 800);

  }, 1200);
}

function choose(state){

// сброс
circle.style.boxShadow = "";
circle.style.transform = "";

}

if(state === "anxiety"){
  circle.style.boxShadow = "0 0 100px rgba(255,100,100,0.15)";
}

if(state === "alone"){
  circle.style.boxShadow = "0 0 80px rgba(100,100,255,0.1)";
}

if(state === "empty"){
  circle.style.boxShadow = "0 0 40px rgba(255,255,255,0.03)";
}

if(state === "anger"){
  circle.style.boxShadow = "0 0 120px rgba(255,80,80,0.25)";
}

if(state === "overload"){
  circle.style.boxShadow = "0 0 140px rgba(255,255,255,0.12)";
}

  const text = document.getElementById("text");
  const options = document.getElementById("options");

  options.style.opacity = 0;
  text.style.opacity = 0;

  setTimeout(() => {

    let response = "";

    state = state?.trim();
    if(state === "tired"){

    ru: [

`Ты устал.

Давай мягко:

🌿 закрой глаза на 10 секунд  
🫁 просто подыши  

Этого достаточно.`,

Можно отпустить чуть-чуть.

👣 остановись

Я рядом.`

Давай м’яко:

🌿 закрий очі на 10 секунд  
🫁 просто подихай  

Цього достатньо.`,

`Ти тримався довго.

Можна трохи відпустити.

👣 зупинись  
☕ дай собі хвилину  

Я поруч.`

`Пусто.

    if(state === "clear"){

`Ты хочешь быть понятным.

    ]

  };

  const langVariants = variants[currentLang] || variants["ru"];
  response = langVariants[Math.floor(Math.random() * langVariants.length)];
}


    if(state === "anxiety"){

  state = state?.trim();    
  const variants = {

    ru: [

`Тревожно.

Давай снизим это:

    en: [

    ua: [

}

    ]

  };

  const langVariants = variants[currentLang] || variants["ru"];

}

if(state === "anger"){

if(state === "disappointed"){

  const variants = {

    ru: [

`Разочарование.

Это больно.

Но это не конец.

</button>

text.style.opacity = 1;

  }, 1200);

  setTimeout(() => {

}

window.onload = function(){

  const last = localStorage.getItem("lastState");

  // заполняем UI по языку
  document.getElementById("text").innerHTML = `
  <h2>Still Here</h2>
  <small>Calm Inside</small><br>
  <small>${texts[currentLang].subtitle}</small><br><br>
  ${texts[currentLang].start}
  `;

  document.getElementById("startBtn").innerText = texts[currentLang].button;
  document.getElementById("question").innerText = texts[currentLang].question;

  document.getElementById("opt_tired").innerText = texts[currentLang].tired;

  document.getElementById("opt_understood").innerText = texts[currentLang].understood;
  document.getElementById("opt_clear").innerText = texts[currentLang].clear;

      };

      document.getElementById("text").innerHTML = returns[currentLang];

}

async function sendMessage(){

  console.log("🚀 SEND CLICKED");

  const input = document.getElementById("userInput").value.trim();
  const text = document.getElementById("text");

  if(!input){
    text.innerHTML = {
      ru: "Попробуй написать хотя бы одно слово.",
      en: "Try writing at least one word.",
      ua: "Спробуй написати хоча б одне слово."
    }[currentLang];
    return;
  }

  // состояние ожидания
  text.innerHTML = {
    ru: "Я рядом...",
    en: "I'm here...",
    ua: "Я поруч..."
  }[currentLang];

  try {

    console.log("📡 SENDING REQUEST TO SERVER...");

    const res = await fetch("https://still-here-mwnq.onrender.com/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: input
      })
    });

    console.log("📩 RESPONSE STATUS:", res.status);

    const data = await res.json();

    console.log("🧠 SERVER DATA:", data);

    const reply = data.reply;

    text.innerHTML = reply + `

<br><br>

<div style="margin-top:15px;">
  <input 
    id="userInput" 
    placeholder="${{
      ru: "Напиши, что внутри...",
      en: "Write what you feel...",
      ua: "Напиши, що відчуваєш..."
    }[currentLang]}"
    style="
      width:80%;
      padding:10px;
      border-radius:20px;
      border:none;
      outline:none;
      margin-bottom:10px;
    "
  />
</div>

<button onclick="sendMessage()">
${{
  ru: "Ответить",
  en: "Reply",
  ua: "Відповісти"
}[currentLang]}
</button>

<br><br>

<button onclick="restart()" style="
  margin-top:10px;
  padding:8px 16px;
  border:none;
  border-radius:20px;
  background:rgba(255,255,255,0.1);
  color:#fff;
  cursor:pointer;
">
${{
  ru: "Я готов, давай дальше",
  en: "I'm ready, let's go",
  ua: "Я готовий, давай далі"
}[currentLang]}
</button>
`;

  } catch (e) {

    console.log("❌ FETCH ERROR:", e);

    // fallback
    const fallback = {

      ru: `
Я вижу.

Ты уже сделал важное — сказал это.

Иногда этого достаточно, чтобы стало легче.

Я рядом.
      `,

      en: `
I see it.

You already did something important — you said it.

Sometimes that’s enough to feel a bit lighter.

I’m here.
      `,

      ua: `
Я бачу.

Ти вже зробив важливе — сказав це.

Іноді цього достатньо, щоб стало легше.

Я поруч.
      `

    };

    text.innerHTML = fallback[currentLang];
  }
}

  currentLang = lang;
  localStorage.setItem("lang", lang);
